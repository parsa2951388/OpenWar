name: Temporary repository formatting pass

on:
  push:
    branches:
      - "open-war/openfront-experience-redesign-2026-11"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked toolchain
        run: |
          npm install --global --ignore-scripts npm@12.1.0
          npm ci
      - name: Apply repository formatter to the two flagged files
        run: npx --no-install oxfmt src/client/components/StatsTable.ts src/client/hud/layers/ChatDisplay.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/components/StatsTable.ts src/client/hud/layers/ChatDisplay.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply repository formatter to HUD components"
            git push
          fi
