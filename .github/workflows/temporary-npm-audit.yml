name: 🔎 Temporary npm audit inspector

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci --no-audit --no-fund
      - name: Report dependency advisories without changing the lockfile
        run: |
          npm audit --json > /tmp/openwar-npm-audit.json || true
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("/tmp/openwar-npm-audit.json", "utf8"));
          console.log("SUMMARY", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: (item.via ?? []).map(v => typeof v === "string" ? v : ({
                source: v.source,
                name: v.name,
                title: v.title,
                url: v.url,
                range: v.range
              }))
            }));
          }
          NODE
