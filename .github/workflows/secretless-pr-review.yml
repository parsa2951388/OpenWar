name: Secretless PR Review

on:
  workflow_call:

permissions:
  contents: read

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check PR diff for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Run project lint
        run: npm run lint:github

      - name: Run complete TypeScript typecheck
        run: npm run typecheck

      - name: Verify formatting
        run: npm run format:check

      - name: Build production application
        run: npm run build-prod

      - name: Publish review summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Secretless automated PR review"
            echo
            echo "- Result: **$JOB_STATUS**"
            echo "- PR diff whitespace validation"
            echo "- Project lint"
            echo "- Full TypeScript typecheck"
            echo "- Formatting validation"
            echo "- Production build"
            echo
            echo "This check uses deterministic repository tooling and requires no Claude, Anthropic, or other model credentials. The complete test suite remains enforced by the separate CI workflow. This is not represented as an LLM or human semantic code review."
          } >> "$GITHUB_STEP_SUMMARY"
