name: Format Open War redesign branch

on:
  push:
    branches:
      - open-war/openfront-experience-redesign-2026-11

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style: format Open War redesign branch')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: open-war/openfront-experience-redesign-2026-11
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install repository-pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Format changed files
        run: |
          npx oxfmt --write \
            src/client/components/EditionHub.css \
            src/client/hud/layers/GameRightSidebar.ts \
            src/client/hud/layers/MainRadialMenu.ts \
            src/client/utilities/ShareGame.ts \
            tests/client/GameModeSelectorBattleHub.test.ts \
            tests/client/components/EditionHub.test.ts
      - name: Commit formatter output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: format Open War redesign branch"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "All selected files are formatted."
          fi
