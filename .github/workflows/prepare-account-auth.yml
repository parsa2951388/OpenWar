name: Prepare Open War authentication PR

on:
  push:
    branches:
      - open-war/account-auth

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v7
        with:
          ref: open-war/account-auth
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up npm
        run: npm install --global --ignore-scripts npm@12.1.0

      - name: Install locked dependencies
        run: npm ci

      - name: Apply repository formatter
        run: npm run format

      - name: Create and assign the required milestone
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "Account Authentication";
            const listed = await github.rest.issues.listMilestones({
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            let milestone = listed.data.find((item) => item.title === title);
            if (!milestone) {
              const created = await github.rest.issues.createMilestone({
                owner,
                repo,
                title,
                description: "Email/password account registration and login, persistent player identity, and secure self-hosted authentication rollout.",
              });
              milestone = created.data;
            }
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: 10,
              milestone: milestone.number,
            });
            core.info(`Assigned PR #10 to milestone #${milestone.number} (${milestone.title}).`);

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
          else
            git commit -m "style: format Open War authentication changes"
            git push origin HEAD:open-war/account-auth
          fi
          npm run format:check
