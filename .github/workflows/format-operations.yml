name: Format Operations branch

on:
  push:
    branches:
      - open-war/operations-missions-alpha

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Operations branch
        uses: actions/checkout@v7
        with:
          ref: open-war/operations-missions-alpha

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatter
        run: npm run format

      - name: Regenerate checked-in maps and schemas
        run: npm run gen-maps

      - name: Verify formatter
        run: npm run format:check

      - name: Commit formatter output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(operations): apply repository formatter"
            git push origin HEAD:open-war/operations-missions-alpha
          fi
