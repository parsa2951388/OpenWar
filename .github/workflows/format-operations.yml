name: Format Operations branch
on:
  push:
    branches:
      - open-war/operations-missions-alpha
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed Operations sources
        run: >-
          npx oxfmt --write
          src/client/SinglePlayerModal.ts
          src/client/components/EditionHub.css
          src/client/components/EditionHub.ts
          src/client/components/OperationsCampaign.ts
          src/client/components/OperationsMissions.ts
          src/client/hud/layers/WinModal.ts
          tests/client/OperationsCampaign.test.ts
          tests/client/OperationsMissions.test.ts
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/SinglePlayerModal.ts src/client/components/EditionHub.css src/client/components/EditionHub.ts src/client/components/OperationsCampaign.ts src/client/components/OperationsMissions.ts src/client/hud/layers/WinModal.ts tests/client/OperationsCampaign.test.ts tests/client/OperationsMissions.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(operations): format campaign sources"
          git push
