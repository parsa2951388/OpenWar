name: 🔧 Temporary Open War formatter

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 122 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci --no-audit --no-fund
      - name: Format the regression test
        run: npm run format -- tests/CloudflareApiGateway.test.ts
      - name: Commit formatting
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/CloudflareApiGateway.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "style: format gateway origin regression test"
            git push origin "HEAD:${PR_BRANCH}"
          fi
