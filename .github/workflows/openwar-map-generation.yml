name: Open War one-time map generation
on:
  push:
    branches:
      - feature/openwar-brand-mobile-lite-map
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - uses: actions/setup-go@v7
        with:
          go-version-file: map-generator/go.mod
          cache-dependency-path: map-generator/go.sum
      - run: npm ci
      - name: Format source metadata first
        run: >-
          npx oxfmt --write
          map-generator/assets/maps/amazonriver/info.json
          map-generator/assets/maps/archipelagosea/info.json
          map-generator/assets/maps/didier/info.json
          map-generator/assets/maps/didierfrance/info.json
          map-generator/assets/maps/fourislands/info.json
          map-generator/assets/maps/marenostrum/info.json
          map-generator/assets/maps/sol/info.json
          map-generator/assets/maps/warshipwarship/info.json
      - name: Regenerate only the maps whose descriptions changed
        run: |
          cd map-generator
          go run -tags nodynamic . --maps=amazonriver,archipelagesea,didier,didierfrance,fourislands,marenostrum,sol,warshipwarship
          cd ..
          npm run gen-map-schema
      - name: Format generated source and manifests
        run: |
          git diff --name-only --diff-filter=ACMR | grep -E '\.(json|ts|css)$' | xargs -r npx oxfmt
      - run: npm run format:check
      - name: Remove helper and commit generated output
        run: |
          rm .github/workflows/openwar-map-generation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Open War map descriptions and assets"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
