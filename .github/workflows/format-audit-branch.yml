name: Format audit branch

on:
  push:
    branches:
      - audit/deep-gameplay-stability

permissions:
  contents: write

concurrency:
  group: format-audit-branch
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit/deep-gameplay-stability
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - name: Format branch
        run: npm run format
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Apply project formatting to audit fixes"
          git push origin HEAD:audit/deep-gameplay-stability
