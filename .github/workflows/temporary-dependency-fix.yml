name: 🔧 Temporary dependency fix candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  candidate:
    if: github.event.pull_request.number == 120 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci --no-audit --no-fund
      - name: Apply semver-compatible fixes
        run: |
          npm audit fix || true
          npm view vitest@4.1.12 version
          npm view @vitest/coverage-v8@4.1.12 version
          npm view @vitest/ui@4.1.12 version
          npm pkg set 'devDependencies.vitest=^4.1.12'
          npm pkg set 'devDependencies.@vitest/coverage-v8=^4.1.12'
          npm pkg set 'devDependencies.@vitest/ui=^4.1.12'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify dependency audit
        run: npm ci --no-audit --no-fund && npm audit --audit-level=low
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build-prod
      - name: Lint
        run: npm run lint:github
      - name: Formatting
        run: npm run format:check
      - name: Generated maps
        run: |
          npm run gen-maps
          git diff --exit-code -- . ':(exclude)package.json' ':(exclude)package-lock.json'
      - name: Test shard 1/3
        run: npm test -- --shard=1/3
      - name: Test shard 2/3
        run: npm test -- --shard=2/3
      - name: Test shard 3/3
        run: npm test -- --shard=3/3
      - name: Commit dependency fixes to PR branch
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "fix(deps): patch audited npm vulnerabilities"
            git push origin "HEAD:${PR_BRANCH}"
          fi
