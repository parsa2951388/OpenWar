name: 🔎 Automated PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "packages/**/*.ts"
      - "src/**/*.ts"
      - "tests/**/*.ts"
      - "scripts/**/*.ts"
      - "*.ts"
      - "package.json"

# This workflow runs on the untrusted PR merge ref with read-only permissions.
# It does not check out code under pull_request_target and does not require
# third-party API keys or personal access tokens.
permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    uses: ./.github/workflows/secretless-pr-review.yml
