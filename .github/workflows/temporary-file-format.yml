name: Temporary Operations file formatter

on:
  push:
    branches:
      - open-war/new-operations-hardening

permissions:
  contents: read

jobs:
  format-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install locked dependencies
        run: npm ci
      - name: Format two security files
        run: npx oxfmt --write src/server/SecurityHeaders.ts tests/server/SecurityHeaders.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: formatted-security-files
          path: |
            src/server/SecurityHeaders.ts
            tests/server/SecurityHeaders.test.ts
          retention-days: 1
