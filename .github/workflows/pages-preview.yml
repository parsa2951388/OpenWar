name: 🚀 Open War v2 — GitHub Pages Preview

on:
  push:
    branches:
      - release/openwar-v2-version-polish
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-war-v2-pages
  cancel-in-progress: true

jobs:
  test:
    name: Test shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up npm 12
        run: npm install --global --ignore-scripts npm@12.1.0

      - name: Install dependencies
        run: npm ci

      - name: Run test shard
        run: npm test -- --shard=${{ matrix.shard }}/3

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      GITHUB_PAGES: "true"
      API_ORIGIN: "https://openwar-api-gateway.parsaoj.workers.dev"
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up npm 12
        run: npm install --global --ignore-scripts npm@12.1.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static Open War site
        run: npm run build-prod

      - name: Verify repository Pages paths and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -s static/index.html
          grep -Fq 'src="/OpenWar/assets/' static/index.html
          grep -Fq 'cdnBase: "/OpenWar"' static/index.html
          grep -Fq 'href="/OpenWar/_assets/' static/index.html
          touch static/.nojekyll
          echo "Verified /OpenWar/ asset base and static bootstrap."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Open War v2 preview
        id: deployment
        uses: actions/deploy-pages@v4
