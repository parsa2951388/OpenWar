name: Open War one-time quickbar formatter
on:
  push:
    branches:
      - feature/openwar-brand-mobile-lite-map
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - name: Format quick-build UI
        run: npx oxfmt src/client/hud/layers/UnitDisplay.ts tests/client/UnitDisplay.test.ts
      - run: npm run format:check
      - name: Remove formatter and commit
        run: |
          rm .github/workflows/openwar-quickbar-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Format quick-build name and price labels"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
