name: One-time Open War formatter

on:
  push:
    branches:
      - feature/openwar-command-home-v1

permissions:
  contents: write

concurrency:
  group: openwar-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-format-helper]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/openwar-command-home-v1
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Pin CI npm version
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install locked dependencies
        run: npm ci
      - name: Format repository with the project's formatter
        run: npm run format
      - name: Commit formatted homepage files
        shell: bash
        run: |
          git add -u -- .
          if git diff --cached --quiet; then
            echo "No formatting changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Open War homepage [skip-format-helper]"
          git push origin HEAD:feature/openwar-command-home-v1
