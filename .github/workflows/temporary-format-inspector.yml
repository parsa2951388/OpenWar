name: 🔧 Temporary format inspector

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - name: Format the changed test and show the exact diff
        run: |
          npm run format -- tests/RenderStartCommand.test.ts
          git --no-pager diff -- tests/RenderStartCommand.test.ts
