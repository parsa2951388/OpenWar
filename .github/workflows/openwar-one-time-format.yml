name: Open War one-time format cleanup
on:
  push:
    branches:
      - feature/openwar-brand-mobile-lite-map
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - name: Format changed files
        run: >-
          npx oxfmt
          src/client/hud/layers/UnitDisplay.ts
          tests/client/UnitDisplay.test.ts
          tests/ImpassableTerrain.test.ts
          tests/core/snapshot/FullGameSnapshot.test.ts
          tests/core/snapshot/AircraftExecutions.test.ts
      - name: Remove formatter and commit formatted sources
        run: |
          rm .github/workflows/openwar-one-time-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Format Open War mobile unit display and aircraft snapshot tests"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
