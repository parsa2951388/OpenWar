name: Open War one-time formatter
on:
  push:
    branches:
      - feature/openwar-brand-mobile-lite-map
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - name: Format changed files
        run: >-
          npx oxfmt
          src/client/components/PlayPage.ts
          src/client/styles.css
          src/client/hud/layers/BuildMenu.ts
          src/client/hud/layers/RadialMenu.ts
          src/client/render/gl/render-settings.json
          resources/manifest.json
          packages/engine/src/game/Game.ts
          packages/engine/src/configuration/EngineConfig.ts
          packages/engine/src/execution/FighterExecution.ts
          packages/engine/src/execution/WarshipExecution.ts
          packages/engine/src/execution/MoveFighterExecution.ts
      - run: npm run format:check
      - run: npm run lint:github
      - name: Remove formatter and commit the cleanup
        run: |
          rm .github/workflows/openwar-one-time-format.yml
          if git diff --quiet; then
            echo "No formatting changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Format Open War interface and clear lint errors"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
