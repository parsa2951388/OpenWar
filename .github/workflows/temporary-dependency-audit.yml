name: Temporary dependency audit

on:
  push:
    branches:
      - open-war/new-operations-hardening
  pull_request:
    branches:
      - open-war/operations-missions-alpha

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply compatible security updates
        shell: bash
        run: |
          npm audit fix
          if ! git diff --quiet -- package.json; then
            echo "::error::npm audit fix changed package.json; refusing an unreviewed direct dependency range change."
            git diff -- package.json
            exit 1
          fi
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): patch npm audit vulnerabilities"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=commonjs -e '
            const audit = require("/tmp/npm-audit.json");
            console.log("REMAINING_SUMMARY", JSON.stringify(audit.metadata?.vulnerabilities || {}));
            for (const [name, v] of Object.entries(audit.vulnerabilities || {})) {
              console.log(JSON.stringify({
                name,
                severity: v.severity,
                direct: v.isDirect,
                range: v.range,
                fixAvailable: v.fixAvailable
              }));
            }
          '
