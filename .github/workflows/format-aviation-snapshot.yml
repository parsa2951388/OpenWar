name: Format Open War aviation snapshot test

on:
  push:
    branches:
      - open-war/aviation-airport-store-2026-11

permissions:
  contents: write

concurrency:
  group: format-open-war-aviation-snapshot
  cancel-in-progress: false

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'chore: format aviation snapshot test')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: open-war/aviation-airport-store-2026-11
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci --ignore-scripts
      - name: Format snapshot test
        run: npx oxfmt --write tests/core/snapshot/StructureExecutions.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/core/snapshot/StructureExecutions.test.ts
          if git diff --cached --quiet; then
            echo "Snapshot test is already formatted."
            exit 0
          fi
          git commit -m "chore: format aviation snapshot test"
          git push origin HEAD:open-war/aviation-airport-store-2026-11
