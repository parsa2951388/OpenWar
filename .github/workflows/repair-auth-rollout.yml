name: Repair account-auth rollout checks

on:
  push:
    branches:
      - open-war/account-auth

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout account-auth branch
        uses: actions/checkout@v7
        with:
          ref: open-war/account-auth
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Set up npm
        run: npm install --global --ignore-scripts npm@12.1.0

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Format repository files with the project formatter
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:github

      - name: Create and assign the required milestone
        id: milestone
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = "Account Authentication";
            const description = "Email/password registration and login, persistent guest identity linking, and secure self-hosted authentication rollout.";

            const { data: existing } = await github.rest.issues.listMilestones({
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            let milestone = existing.find((item) => item.title === title);
            if (!milestone) {
              const { data: created } = await github.rest.issues.createMilestone({
                owner,
                repo,
                title,
                description,
              });
              milestone = created;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: 10,
            });
            if (pull.milestone?.number !== milestone.number) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: 10,
                milestone: milestone.number,
              });
            }
            core.setOutput("milestone_number", String(milestone.number));
            core.info(`Assigned "${title}" (#${milestone.number}) to PR #10.`);

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit formatter changes
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # GITHUB_TOKEN cannot update workflow files; that one file is handled
          # through the authenticated GitHub connector after the formatter run.
          git restore --staged .github/workflows/ci.yml
          git diff --cached --name-only > "$RUNNER_TEMP/formatted-files.txt"
          if ! git diff --cached --quiet; then
            HUSKY=0 git commit -m "style: format account-auth rollout files"
            git push origin HEAD:open-war/account-auth
          fi

      - name: Package formatted files
        if: always()
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/formatted-account-auth-files.tar.gz"
          if [ -s "$RUNNER_TEMP/formatted-files.txt" ]; then
            tar -czf "$archive" -T "$RUNNER_TEMP/formatted-files.txt"
          else
            tar -czf "$archive" --files-from /dev/null
          fi

      - name: Upload formatter artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formatted-account-auth-files
          path: ${{ runner.temp }}/formatted-account-auth-files.tar.gz
          if-no-files-found: warn
          retention-days: 3
