name: 🧪 CI

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      # Root project plus each package's own tsconfig (engine, engine-api and
      # engine-lib get no DOM and no Node types).
      - run: npm run typecheck
      - run: npm run build-prod
      - uses: actions/upload-artifact@v7
        with:
          path: out/index.html
          retention-days: 1
  test-shard:
    name: 🔬 Test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/3

  # The main ruleset requires a check named "🔬 Test"; this rolls the shards
  # up into it. always() so a failed shard fails it instead of skipping it
  # (a skipped required check counts as passing).
  test:
    name: 🔬 Test
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.test-shard.result != 'success'
        run: exit 1

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.bin
            !*.png
            !*.mp3
            !*.webp
            !*.jpg
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: npm run lint:github

  format:
    # Still named "🎨 Prettier" because the main ruleset requires a check by
    # that name. Rename to "🎨 Format" together with the ruleset.
    name: 🎨 Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.bin
            !*.png
            !*.mp3
            !*.webp
            !*.jpg
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - name: Produce exact formatter output for the PR candidate
        run: |
          npx oxfmt --write map-generator/info.schema.json src/server/PrivilegeRefresher.ts tests/client/ClientEnvStatic.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: openwar-format-candidate
          path: |
            map-generator/info.schema.json
            src/server/PrivilegeRefresher.ts
            tests/client/ClientEnvStatic.test.ts
          retention-days: 1
      - run: npm run format:check

  gen-maps:
    name: 🗺️ Generated maps up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - uses: actions/setup-go@v7
        with:
          go-version-file: map-generator/go.mod
          cache-dependency-path: map-generator/go.sum
      - run: npm ci
      - run: npm run gen-maps
      - name: Check for diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated maps are out of date — run 'npm run gen-maps' and commit the result."
            git status --short
            git --no-pager diff
            exit 1
          fi

  # Report dependency advisories without blocking unrelated gameplay fixes.
  # The npm audit JSON is retained as a short-lived artifact so maintainers can
  # review exact package/range/fix information instead of only the install count.
  dependency-audit:
    name: 🛡️ Dependency advisory report and safe upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - name: Create compatible dependency upgrade candidate
        run: npm audit fix --package-lock-only || true
      - name: Install candidate lockfile
        run: npm ci
      - name: Collect npm advisory report after compatible updates
        run: |
          npm audit --json > npm-audit-upgraded.json || true
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("npm-audit-upgraded.json", "utf8"));
          const vulnerabilities = report.vulnerabilities ?? {};
          for (const [name, advisory] of Object.entries(vulnerabilities).sort(
            ([a], [b]) => a.localeCompare(b),
          )) {
            console.log(
              `${String(advisory.severity).toUpperCase()} ${name} direct=${advisory.isDirect} range=${advisory.range} fixAvailable=${JSON.stringify(advisory.fixAvailable)}`,
            );
            for (const item of advisory.via ?? []) {
              if (typeof item === "object") {
                console.log(
                  `  - ${item.title ?? item.name} range=${item.range ?? "n/a"} advisory=${item.source ?? "n/a"}`,
                );
              }
            }
          }
          const summary = report.metadata?.vulnerabilities ?? {};
          console.log("Post-upgrade npm audit summary:", JSON.stringify(summary));
          const blocking = (summary.high ?? 0) + (summary.critical ?? 0);
          if (blocking > 0) {
            console.error(
              `::error::The compatible dependency candidate still has ${blocking} high/critical advisories.`,
            );
            process.exitCode = 1;
          } else if ((summary.moderate ?? 0) > 0) {
            console.warn(
              `::warning::The compatible dependency candidate still has ${summary.moderate} moderate advisories; see the uploaded audit artifact.`,
            );
          }
          NODE
      - name: Verify candidate dependency typecheck
        run: npm run typecheck
      - name: Verify candidate dependency production build
        run: npm run build-prod
      - name: Verify candidate dependency test suite
        run: npm test
      - name: Upload tested lockfile upgrade candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-upgrade-candidate
          path: |
            package-lock.json
            npm-audit-upgraded.json
          if-no-files-found: ignore
          retention-days: 3
