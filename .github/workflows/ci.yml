name: 🧪 CI

on:
  workflow_dispatch:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    # Revalidate the formatted lobby selector and all production release checks.
# Recheck the bootstrap-safe lobby selector fix and the complete production release.
# Recheck the final production source, generated maps, and release container.
# Validate the production branch, including deterministic simulation and release packaging.
# Validate the self-hosted production branch on every push.
    branches: [main, open-war/independent-self-host]

permissions:
  contents: read

jobs:
  dependency-repair-preview:
    name: 🧰 Prepare dependency and format repair
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'audit/operations-ux-refresh-2026-11' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply compatible npm advisory fixes
        continue-on-error: true
        run: npm audit fix --ignore-scripts
      - name: Format changed source and localization files
        run: npm run format -- src/client/components/EditionHub.ts src/client/components/EditionHub.css src/client/components/OperationsCampaign.ts tests/client/OperationsCampaign.test.ts resources/lang/en.json resources/lang/fa.json
      - name: Verify production dependency audit after repair
        run: npm audit --omit=dev --audit-level=high
      - name: Commit repaired lockfile and formatted files
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/client/components/EditionHub.ts src/client/components/EditionHub.css src/client/components/OperationsCampaign.ts tests/client/OperationsCampaign.test.ts resources/lang/en.json resources/lang/fa.json
          if git diff --cached --quiet; then
            echo "No dependency or formatting changes to commit."
            exit 0
          fi
          git commit -m "fix(security): update production dependencies and format Operations UI"
          git push origin "HEAD:${BRANCH_NAME}"
          gh workflow run ci.yml --ref "${BRANCH_NAME}"

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      # Root project plus each package's own tsconfig (engine, engine-api and
      # engine-lib get no DOM and no Node types).
      - run: npm run typecheck
      - run: npm run build-prod
      - uses: actions/upload-artifact@v7
        with:
          path: out/index.html
          retention-days: 1
  dependency-audit:
    name: 🔒 Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install production dependency graph
        run: npm ci --omit=dev --ignore-scripts
      - name: Block high and critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high

  test-shard:
    name: 🔬 Test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/3

  # The main ruleset requires a check named "🔬 Test"; this rolls the shards
  # up into it. always() so a failed shard fails it instead of skipping it
  # (a skipped required check counts as passing).
  test:
    name: 🔬 Test
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.test-shard.result != 'success'
        run: exit 1

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.bin
            !*.png
            !*.mp3
            !*.webp
            !*.jpg
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: npm run lint:github

  format:
    # Still named "🎨 Prettier" because the main ruleset requires a check by
    # that name. Rename to "🎨 Format" together with the ruleset.
    name: 🎨 Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.bin
            !*.png
            !*.mp3
            !*.webp
            !*.jpg
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: npm run format:check

  gen-maps:
    name: 🗺️ Generated maps up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - uses: actions/setup-go@v7
        with:
          go-version-file: map-generator/go.mod
          cache-dependency-path: map-generator/go.sum
      - run: npm ci
      - run: npm run gen-maps
      - name: Check for diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated maps are out of date — run 'npm run gen-maps' and commit the result."
            git status --short
            git --no-pager diff
            exit 1
          fi


  # Validate the actual production container, not only Vite's static bundle.
  # This catches missing files and Docker-stage regressions before a deploy.
  docker-build:
    name: 🐳 Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Build production image
        run: docker build --pull --tag open-war:ci .
