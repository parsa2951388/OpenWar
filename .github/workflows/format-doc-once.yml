name: Format audit document once

on:
  push:
    branches:
      - claude/deep-audit-fixes

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: claude/deep-audit-fixes
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - name: Format the only reported file
        run: npm run format -- docs/OpenWarDeepAudit.md
      - name: Commit formatting
        run: |
          if git diff --quiet -- docs/OpenWarDeepAudit.md; then
            echo "Document is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/OpenWarDeepAudit.md
          git commit -m "Format Open War audit report"
          git push origin HEAD:claude/deep-audit-fixes
