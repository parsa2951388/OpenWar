name: Format competitive roadmap

on:
  push:
    branches:
      - open-war/maintenance-gate-and-ui-expansion
    paths:
      - ".github/workflows/format-competitive-roadmap.yml"
      - "docs/COMPETITIVE_FEATURE_ROADMAP.md"

permissions:
  contents: write

concurrency:
  group: format-competitive-roadmap
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: open-war/maintenance-gate-and-ui-expansion
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Format roadmap
        run: npx oxfmt --write docs/COMPETITIVE_FEATURE_ROADMAP.md
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/COMPETITIVE_FEATURE_ROADMAP.md
          if git diff --cached --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git commit -m "style: format competitive roadmap"
          git push origin HEAD:open-war/maintenance-gate-and-ui-expansion
