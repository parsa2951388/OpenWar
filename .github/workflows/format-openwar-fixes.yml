name: Format Open War Mobile Fixes

on:
  push:
    branches:
      - release/openwar-v2-version-polish
    paths:
      - .github/workflows/format-openwar-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: release/openwar-v2-version-polish
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: >
          npx oxfmt --write
          src/client/GameModeSelector.ts
          src/client/ClientEnv.ts
          src/client/components/PlayPage.ts
          src/client/styles.css
          tests/client/PlayPageTopBar.test.ts
          tests/GameModeSelectorGating.test.ts
          tests/GameModeSelectorGatingWiring.test.ts
          tests/DesktopUpdateStateSeeding.test.ts
          tests/ReachabilityGating.test.ts
          tests/client/GameModeSelectorLock.test.ts
          resources/lang/en.json
          resources/lang/fa.json

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "All targeted files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/GameModeSelector.ts src/client/ClientEnv.ts src/client/components/PlayPage.ts src/client/styles.css tests/client/PlayPageTopBar.test.ts tests/GameModeSelectorGating.test.ts tests/GameModeSelectorGatingWiring.test.ts tests/DesktopUpdateStateSeeding.test.ts tests/ReachabilityGating.test.ts tests/client/GameModeSelectorLock.test.ts resources/lang/en.json resources/lang/fa.json
          git commit -m "style: format Open War mobile and server routing fixes"
          git push origin HEAD:release/openwar-v2-version-polish
