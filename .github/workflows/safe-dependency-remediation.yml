name: Safe dependency remediation

on:
  push:
    branches:
      - open-war/security-ops-polish

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Setup pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply non-breaking advisory fixes only
        run: npm audit fix --ignore-scripts --no-fund
      - name: Report remaining advisories
        run: |
          npm audit --json > npm-audit-after.json || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("npm-audit-after.json", "utf8"));
          console.log("Remaining advisories:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
            }));
          }
          NODE
      - name: Commit safe dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No compatible dependency changes were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: update vulnerable compatible dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
