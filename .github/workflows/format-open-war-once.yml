name: One-time branch formatting

on:
  push:
    branches:
      - open-war/security-ops-polish

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Setup pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Format changed implementation and tests
        run: |
          npx oxfmt --write \
            src/client/components/EditionHub.css \
            src/server/GameApiCors.ts \
            src/server/Master.ts \
            src/server/SecurityHeaders.ts \
            src/server/Worker.ts \
            src/server/WorkerLobbyService.ts \
            tests/server/SecurityHeaders.test.ts \
            tests/server/WorkerLobbyServiceClients.test.ts
      - name: Commit formatter output to this branch
        run: |
          if git diff --quiet; then
            echo "All targeted files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/client/components/EditionHub.css \
            src/server/GameApiCors.ts \
            src/server/Master.ts \
            src/server/SecurityHeaders.ts \
            src/server/Worker.ts \
            src/server/WorkerLobbyService.ts \
            tests/server/SecurityHeaders.test.ts \
            tests/server/WorkerLobbyServiceClients.test.ts
          git commit -m "style: format security and Operations changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
