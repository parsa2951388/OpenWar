name: Temporary Render preview formatter

on:
  push:
    branches:
      - release/openwar-v2-version-polish

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install dependencies
        run: npm ci
      - name: Format preview files
        run: npm run format -- src/server/ServerEnv.ts tests/server/ServerEnv.test.ts
      - name: Commit formatter output if needed
        run: |
          if ! git diff --quiet -- src/server/ServerEnv.ts tests/server/ServerEnv.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/server/ServerEnv.ts tests/server/ServerEnv.test.ts
            git commit -m "style: format Render preview hostname changes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
