name: Temporary generated schema formatter

on:
  push:
    branches:
      - open-war/new-operations-hardening

permissions:
  contents: read

jobs:
  format-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install dependencies
        run: npm ci
      - name: Run the exact schema generator and formatter
        run: npm run gen-map-schema
      - uses: actions/upload-artifact@v7
        with:
          name: generated-map-schema
          path: map-generator/info.schema.json
          retention-days: 1
