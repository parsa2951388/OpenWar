name: Temporary generated schema formatter

on:
  push:
    branches:
      - open-war/new-operations-hardening

permissions:
  contents: write

jobs:
  format-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install dependencies
        run: npm ci
      - name: Run the exact schema generator and formatter
        run: npm run gen-map-schema
      - name: Commit exact generated output and remove this temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map-generator/info.schema.json
          git rm .github/workflows/temporary-schema-format.yml
          git commit -m "chore(maps): commit exact generated schema formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
