name: Apply staged Open War patch

on:
  push:
    branches:
      - main
    paths:
      - ".openwar-patch/READY"

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Rebuild, format and apply patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/openwar.patch.b64
          while IFS= read -r file; do
            base64 --decode "$file" >> /tmp/openwar.patch.b64
          done < <(find .openwar-patch -type f -name 'piece_*.b64' | sort)
          base64 --decode /tmp/openwar.patch.b64 | gzip --decompress | git apply --binary -
          changed_files=$(git diff --name-only --diff-filter=ACM | grep -E '\\.(ts|tsx|js|jsx|json|md|yml|yaml|css|scss|html)$' || true)
          if [ -n "$changed_files" ]; then
            printf '%s\\n' "$changed_files" | xargs npx oxfmt
          fi
          npm run format:check
          git diff --check
          rm -rf .openwar-patch
          rm -f .github/workflows/apply-openwar-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement aircraft warfare, airports and performance refinements"
          git push origin main
